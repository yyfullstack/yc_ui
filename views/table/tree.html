<!DOCTYPE html>
<html lang="zh-CN" yc-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>树形表格 - Table Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/index.css">
    <style>
        body { padding: 32px; background: var(--yc-color-bg-page); font-family: var(--yc-font-family); }
        .container { max-width: 1200px; margin: 0 auto; }
        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .page-header p { color: var(--yc-color-text-secondary); }
        .demo-card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .demo-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #ebeef5; }

        .yc-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: #fff;
        }
        .yc-data-table th, .yc-data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ebeef5;
        }
        .yc-data-table th {
            font-weight: 600;
            color: #606266;
            background: #fafafa;
        }
        .yc-data-table tbody tr:hover { background: #f5f7fa; }
        .yc-data-table.stripe tbody tr:nth-child(even) { background: #fafafa; }
        .yc-data-table.border { border: 1px solid #ebeef5; }
        .yc-data-table.border th, .yc-data-table.border td { border: 1px solid #ebeef5; }
        .cell-center { text-align: center; }
        .cell-right { text-align: right; }
        .tree-indent { display: inline-block; width: 20px; }
        .tree-icon { cursor: pointer; width: 20px; display: inline-block; text-align: center; }
        .expand-icon { cursor: pointer; width: 20px; display: inline-block; text-align: center; transition: transform 0.2s; }
        .expand-icon.expanded { transform: rotate(90deg); }

        .table-pagination {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
        }
        .table-pagination button {
            padding: 6px 12px;
            border: 1px solid #dcdfe6;
            background: #fff;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }
        .table-pagination button:hover:not(:disabled) { color: var(--yc-color-primary); border-color: var(--yc-color-primary); }
        .table-pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
        .table-pagination button.active { background: var(--yc-color-primary); color: #fff; border-color: var(--yc-color-primary); }
    </style>
    <script src="https://unpkg.com/vue@3.4.0/dist/vue.global.prod.js"></script>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="page-header">
                <h1>树形表格</h1>
                <p>支持树形结构数据展示，可展开/收起</p>
            </div>

            <div class="demo-card">
                <h3>树形数据</h3>
                <table class="yc-data-table stripe border">
                    <thead>
                        <tr>
                            <th>名称</th>
                            <th class="cell-center" style="width: 100px;">类型</th>
                            <th class="cell-right" style="width: 100px;">大小</th>
                            <th class="cell-center" style="width: 180px;">修改时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template v-for="row in flatTreeData" :key="row.id">
                            <tr>
                                <td>
                                    <span v-for="i in row.level" :key="i" class="tree-indent"></span>
                                    <span v-if="row.children" class="tree-icon" @click="toggleTreeNode(row.id)">
                                        <i class="fas" :class="expandedTreeNodes.includes(row.id) ? 'fa-chevron-down' : 'fa-chevron-right'"></i>
                                    </span>
                                    <span v-else class="tree-indent"></span>
                                    <i :class="row.type === 'folder' ? 'fas fa-folder' : 'fas fa-file'" style="margin-right: 8px; color: #e6a23c;"></i>
                                    {{ row.name }}
                                </td>
                                <td class="cell-center">{{ row.type }}</td>
                                <td class="cell-right">{{ row.size }}</td>
                                <td class="cell-center">{{ row.updateTime }}</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <div class="demo-card">
                <h3>可展开行</h3>
                <table class="yc-data-table stripe border">
                    <thead>
                        <tr>
                            <th style="width: 40px;"></th>
                            <th>姓名</th>
                            <th>角色</th>
                            <th>部门</th>
                            <th class="cell-center" style="width: 80px;">年龄</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template v-for="row in expandData" :key="row.id">
                            <tr>
                                <td><span class="expand-icon" :class="{ expanded: expandedRows.includes(row.id) }" @click="toggleExpand(row.id)"><i class="fas fa-chevron-right"></i></span></td>
                                <td>{{ row.name }}</td>
                                <td>{{ row.role }}</td>
                                <td>{{ row.department }}</td>
                                <td class="cell-center">{{ row.age }}</td>
                            </tr>
                            <tr v-if="expandedRows.includes(row.id)">
                                <td colspan="5" style="padding: 16px; background: #f5f7fa;">
                                    <div style="display: flex; gap: 32px; flex-wrap: wrap;">
                                        <div><strong>姓名：</strong>{{ row.name }}</div>
                                        <div><strong>邮箱：</strong>{{ row.email }}</div>
                                        <div><strong>电话：</strong>{{ row.phone }}</div>
                                        <div><strong>地址：</strong>{{ row.address }}</div>
                                        <div><strong>入职日期：</strong>{{ row.joinDate }}</div>
                                        <div><strong>薪资：</strong>¥{{ row.salary?.toLocaleString() }}</div>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <div class="demo-card">
                <h3>分页功能</h3>
                <table class="yc-data-table stripe border">
                    <thead>
                        <tr>
                            <th class="cell-center" style="width: 60px;">序号</th>
                            <th>姓名</th>
                            <th>角色</th>
                            <th>部门</th>
                            <th class="cell-center" style="width: 80px;">年龄</th>
                            <th>地址</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(row, index) in pagedData" :key="row.id">
                            <td class="cell-center">{{ (pageCurrent - 1) * pageSize + index + 1 }}</td>
                            <td>{{ row.name }}</td>
                            <td>{{ row.role }}</td>
                            <td>{{ row.department }}</td>
                            <td class="cell-center">{{ row.age }}</td>
                            <td>{{ row.address }}</td>
                        </tr>
                    </tbody>
                </table>
                <div class="table-pagination">
                    <button :disabled="pageCurrent <= 1" @click="pageCurrent--"><i class="fas fa-chevron-left"></i></button>
                    <button v-for="p in pageNumbers" :key="p" :class="{ active: p === pageCurrent }" @click="pageCurrent = p">{{ p }}</button>
                    <button :disabled="pageCurrent >= pageTotalPages" @click="pageCurrent++"><i class="fas fa-chevron-right"></i></button>
                    <span style="font-size: 13px; color: #606266;">共 {{ allPageData.length }} 条，{{ pageTotalPages }} 页</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;
        createApp({
            setup() {
                const treeData = ref([
                    { id: 1, name: 'Documents', type: 'folder', size: '-', updateTime: '2024-01-15 10:30:00', children: [
                        { id: 2, name: 'report.pdf', type: 'file', size: '2.5 MB', updateTime: '2024-01-14 09:20:00' },
                        { id: 3, name: 'Projects', type: 'folder', size: '-', updateTime: '2024-01-13 15:45:00', children: [
                            { id: 4, name: 'app.js', type: 'file', size: '15 KB', updateTime: '2024-01-12 11:00:00' },
                            { id: 5, name: 'logo.png', type: 'file', size: '256 KB', updateTime: '2024-01-11 16:30:00' }
                        ]},
                        { id: 6, name: 'data.xlsx', type: 'file', size: '45 KB', updateTime: '2024-01-10 08:15:00' }
                    ]},
                    { id: 7, name: 'Downloads', type: 'folder', size: '-', updateTime: '2024-01-09 14:20:00', children: [
                        { id: 8, name: 'backup.zip', type: 'file', size: '120 MB', updateTime: '2024-01-08 20:00:00' },
                        { id: 9, name: 'installer.exe', type: 'file', size: '85 MB', updateTime: '2024-01-07 10:30:00' }
                    ]},
                    { id: 10, name: 'Pictures', type: 'folder', size: '-', updateTime: '2024-01-06 09:00:00', children: [
                        { id: 11, name: 'avatar.jpg', type: 'file', size: '1.2 MB', updateTime: '2024-01-05 15:30:00' },
                        { id: 12, name: 'banner.png', type: 'file', size: '3.5 MB', updateTime: '2024-01-04 11:20:00' }
                    ]}
                ]);

                const expandedTreeNodes = ref([]);
                function flattenTree(nodes, level = 0) {
                    const result = [];
                    for (const node of nodes) {
                        result.push({ ...node, level });
                        if (node.children && expandedTreeNodes.value.includes(node.id)) {
                            result.push(...flattenTree(node.children, level + 1));
                        }
                    }
                    return result;
                }
                const flatTreeData = computed(() => flattenTree(treeData.value));

                const toggleTreeNode = (id) => {
                    const idx = expandedTreeNodes.value.indexOf(id);
                    if (idx > -1) expandedTreeNodes.value.splice(idx, 1);
                    else expandedTreeNodes.value.push(id);
                };

                const expandData = ref([
                    { id: 1, name: '张三', role: '前端开发', department: '技术部', age: 28, email: 'zhangsan@example.com', phone: '13800138001', address: '北京市朝阳区', joinDate: '2021-03-15', salary: 15000 },
                    { id: 2, name: '李四', role: '后端开发', department: '技术部', age: 32, email: 'lisi@example.com', phone: '13800138002', address: '上海市浦东新区', joinDate: '2019-07-20', salary: 18000 },
                    { id: 3, name: '王五', role: '测试工程师', department: '产品部', age: 25, email: 'wangwu@example.com', phone: '13800138003', address: '广州市天河区', joinDate: '2022-01-10', salary: 12000 },
                    { id: 4, name: '赵六', role: '产品经理', department: '产品部', age: 30, email: 'zhaoliu@example.com', phone: '13800138004', address: '深圳市南山区', joinDate: '2020-05-08', salary: 20000 },
                ]);
                const expandedRows = ref([]);
                const toggleExpand = (id) => {
                    const idx = expandedRows.value.indexOf(id);
                    if (idx > -1) expandedRows.value.splice(idx, 1);
                    else expandedRows.value.push(id);
                };

                function generateData(count) {
                    const names = ['张三', '李四', '王五', '赵六', '孙七', '周八', '吴九', '郑十'];
                    const roles = ['前端开发', '后端开发', '测试工程师', '产品经理', 'UI设计师', '运维工程师'];
                    const departments = ['技术部', '产品部', '设计部', '市场部'];
                    const addresses = ['北京市朝阳区', '上海市浦东新区', '广州市天河区', '深圳市南山区', '杭州市西湖区'];
                    const data = [];
                    for (let i = 0; i < count; i++) {
                        data.push({
                            id: 10001 + i,
                            name: names[i % names.length] + (i >= names.length ? '_' + i : ''),
                            role: roles[i % roles.length],
                            department: departments[i % departments.length],
                            age: 20 + (i % 40),
                            address: addresses[i % addresses.length]
                        });
                    }
                    return data;
                }

                const allPageData = ref(generateData(86));
                const pageCurrent = ref(1);
                const pageSize = ref(10);
                const pageTotalPages = computed(() => Math.ceil(allPageData.value.length / pageSize.value));
                const pagedData = computed(() => {
                    const start = (pageCurrent.value - 1) * pageSize.value;
                    return allPageData.value.slice(start, start + pageSize.value);
                });
                const pageNumbers = computed(() => {
                    const pages = [];
                    for (let i = 1; i <= pageTotalPages.value; i++) pages.push(i);
                    return pages;
                });

                return {
                    treeData, flatTreeData, expandedTreeNodes, toggleTreeNode,
                    expandData, expandedRows, toggleExpand,
                    allPageData, pageCurrent, pageSize, pageTotalPages, pagedData, pageNumbers
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
