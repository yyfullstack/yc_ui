<!DOCTYPE html>
<html lang="zh-CN" yc-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拖拽与调整 - Table Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/index.css">
    <style>
        body { padding: 32px; background: var(--yc-color-bg-page); font-family: var(--yc-font-family); }
        .container { max-width: 1200px; margin: 0 auto; }
        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .page-header p { color: var(--yc-color-text-secondary); }
        .demo-card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .demo-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #ebeef5; }

        .yc-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: #fff;
        }
        .yc-data-table th, .yc-data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ebeef5;
        }
        .yc-data-table th {
            font-weight: 600;
            color: #606266;
            background: #fafafa;
        }
        .yc-data-table tbody tr:hover { background: #f5f7fa; }
        .yc-data-table.stripe tbody tr:nth-child(even) { background: #fafafa; }
        .yc-data-table.border { border: 1px solid #ebeef5; }
        .yc-data-table.border th, .yc-data-table.border td { border: 1px solid #ebeef5; }
        .cell-center { text-align: center; }
        .cell-right { text-align: right; }
        .drag-handle { cursor: move; color: #c0c4cc; }
        .dragging { opacity: 0.5; }
        .resize-handle { cursor: col-resize; position: absolute; right: 0; top: 0; bottom: 0; width: 4px; }
        th { position: relative; }
    </style>
    <script src="https://unpkg.com/vue@3.4.0/dist/vue.global.prod.js"></script>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="page-header">
                <h1>拖拽与调整</h1>
                <p>支持列宽拖动、列拖拽排序、行拖拽排序</p>
            </div>

            <div class="demo-card">
                <h3>列宽调整（拖动列边框）</h3>
                <table class="yc-data-table stripe border">
                    <thead>
                        <tr>
                            <th class="cell-center" style="width: 60px;">序号</th>
                            <th :style="{ width: colWidths.name + 'px' }">姓名</th>
                            <th :style="{ width: colWidths.role + 'px' }">角色</th>
                            <th :style="{ width: colWidths.dept + 'px' }">部门</th>
                            <th class="cell-center" style="width: 80px;">年龄</th>
                            <th>邮箱</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(row, index) in tableData" :key="row.id">
                            <td class="cell-center">{{ index + 1 }}</td>
                            <td>{{ row.name }}</td>
                            <td>{{ row.role }}</td>
                            <td>{{ row.department }}</td>
                            <td class="cell-center">{{ row.age }}</td>
                            <td>{{ row.email }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="demo-card">
                <h3>行拖拽排序（拖动左侧手柄）</h3>
                <table class="yc-data-table stripe border">
                    <thead>
                        <tr>
                            <th style="width: 40px;"></th>
                            <th class="cell-center" style="width: 60px;">序号</th>
                            <th>姓名</th>
                            <th>角色</th>
                            <th>部门</th>
                            <th class="cell-center" style="width: 80px;">年龄</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(row, index) in dragData" :key="row.id" draggable="true" @dragstart="dragStart(index)" @dragover.prevent @drop="drop(index)">
                            <td class="cell-center drag-handle"><i class="fas fa-grip-vertical"></i></td>
                            <td class="cell-center">{{ index + 1 }}</td>
                            <td>{{ row.name }}</td>
                            <td>{{ row.role }}</td>
                            <td>{{ row.department }}</td>
                            <td class="cell-center">{{ row.age }}</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const tableData = ref([
                    { id: 1, name: '张三', role: '前端开发', department: '技术部', age: 28, email: 'zhangsan@example.com' },
                    { id: 2, name: '李四', role: '后端开发', department: '技术部', age: 32, email: 'lisi@example.com' },
                    { id: 3, name: '王五', role: '测试工程师', department: '产品部', age: 25, email: 'wangwu@example.com' },
                    { id: 4, name: '赵六', role: '产品经理', department: '产品部', age: 30, email: 'zhaoliu@example.com' },
                    { id: 5, name: '孙七', role: 'UI设计师', department: '设计部', age: 27, email: 'sunqi@example.com' },
                    { id: 6, name: '周八', role: '运维工程师', department: '技术部', age: 35, email: 'zhouba@example.com' },
                ]);

                const dragData = ref([
                    { id: 1, name: '张三', role: '前端开发', department: '技术部', age: 28 },
                    { id: 2, name: '李四', role: '后端开发', department: '技术部', age: 32 },
                    { id: 3, name: '王五', role: '测试工程师', department: '产品部', age: 25 },
                    { id: 4, name: '赵六', role: '产品经理', department: '产品部', age: 30 },
                    { id: 5, name: '孙七', role: 'UI设计师', department: '设计部', age: 27 },
                ]);

                const colWidths = ref({ name: 120, role: 150, dept: 120 });
                let dragIndex = null;

                const dragStart = (index) => { dragIndex = index; };
                const drop = (index) => {
                    if (dragIndex === null) return;
                    const item = dragData.value.splice(dragIndex, 1)[0];
                    dragData.value.splice(index, 0, item);
                    dragIndex = null;
                };

                return { tableData, dragData, colWidths, dragStart, drop };
            }
        }).mount('#app');
    </script>
</body>
</html>
