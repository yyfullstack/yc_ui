<!DOCTYPE html>
<html lang="zh-CN" yc-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑与校验 - Table Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/index.css">
    <link rel="stylesheet" href="../../styles/components/button.css">
    <style>
        body { padding: 32px; background: var(--yc-color-bg-page); font-family: var(--yc-font-family); }
        .container { max-width: 1200px; margin: 0 auto; }
        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .page-header p { color: var(--yc-color-text-secondary); }
        .demo-card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .demo-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #ebeef5; }
        .actions { margin-bottom: 16px; display: flex; gap: 8px; }
        .result { margin-top: 12px; padding: 12px; background: #f5f7fa; border-radius: 4px; font-size: 13px; color: #606266; }

        .yc-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: #fff;
        }
        .yc-data-table th, .yc-data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ebeef5;
        }
        .yc-data-table th {
            font-weight: 600;
            color: #606266;
            background: #fafafa;
        }
        .yc-data-table tbody tr:hover { background: #f5f7fa; }
        .yc-data-table.stripe tbody tr:nth-child(even) { background: #fafafa; }
        .yc-data-table.border { border: 1px solid #ebeef5; }
        .yc-data-table.border th, .yc-data-table.border td { border: 1px solid #ebeef5; }
        .cell-center { text-align: center; }
        .edit-input {
            width: 100%;
            padding: 4px 8px;
            border: 1px solid #dcdfe6;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
        }
        .edit-input:focus { outline: none; border-color: var(--yc-color-primary); }
        .cell-error { border-color: #f56c6c !important; background: #fef0f0; }

        .context-menu {
            position: fixed;
            background: #fff;
            border: 1px solid #ebeef5;
            border-radius: 4px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            z-index: 9999;
            min-width: 140px;
            padding: 4px 0;
        }
        .context-menu-item {
            padding: 8px 16px;
            cursor: pointer;
            font-size: 13px;
            color: #606266;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .context-menu-item:hover { background: #f5f7fa; color: var(--yc-color-primary); }
        .context-menu-divider { height: 1px; background: #ebeef5; margin: 4px 0; }
    </style>
    <script src="https://unpkg.com/vue@3.4.0/dist/vue.global.prod.js"></script>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="page-header">
                <h1>编辑与校验</h1>
                <p>支持单元格编辑、数据校验、右键菜单</p>
            </div>

            <div class="demo-card">
                <h3>可编辑表格</h3>
                <div class="actions">
                    <button class="yc-button yc-button--primary yc-button--small" @click="insertRow">新增</button>
                    <button class="yc-button yc-button--success yc-button--small" @click="saveData">保存</button>
                </div>
                <table class="yc-data-table stripe border">
                    <thead>
                        <tr>
                            <th class="cell-center" style="width: 60px;">序号</th>
                            <th>姓名</th>
                            <th class="cell-center" style="width: 100px;">性别</th>
                            <th class="cell-center" style="width: 100px;">年龄</th>
                            <th>角色</th>
                            <th>地址</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(row, index) in editData" :key="row.id">
                            <td class="cell-center">{{ index + 1 }}</td>
                            <td><input class="edit-input" v-model="row.name"></td>
                            <td class="cell-center">
                                <select class="edit-input" v-model="row.sex">
                                    <option value="男">男</option>
                                    <option value="女">女</option>
                                </select>
                            </td>
                            <td class="cell-center"><input class="edit-input" v-model.number="row.age" type="number"></td>
                            <td><input class="edit-input" v-model="row.role"></td>
                            <td><input class="edit-input" v-model="row.address"></td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div class="demo-card">
                <h3>数据校验</h3>
                <div class="actions">
                    <button class="yc-button yc-button--primary yc-button--small" @click="validateData">校验</button>
                </div>
                <table class="yc-data-table stripe border">
                    <thead>
                        <tr>
                            <th class="cell-center" style="width: 60px;">序号</th>
                            <th>姓名</th>
                            <th class="cell-center" style="width: 100px;">性别</th>
                            <th class="cell-center" style="width: 100px;">年龄</th>
                            <th>邮箱</th>
                            <th>电话</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(row, index) in validData" :key="row.id">
                            <td class="cell-center">{{ index + 1 }}</td>
                            <td><input class="edit-input" v-model="row.name" :class="{ 'cell-error': validErrors[row.id]?.name }"></td>
                            <td class="cell-center">
                                <select class="edit-input" v-model="row.sex">
                                    <option value="男">男</option>
                                    <option value="女">女</option>
                                </select>
                            </td>
                            <td class="cell-center"><input class="edit-input" v-model.number="row.age" type="number" :class="{ 'cell-error': validErrors[row.id]?.age }"></td>
                            <td><input class="edit-input" v-model="row.email" :class="{ 'cell-error': validErrors[row.id]?.email }"></td>
                            <td><input class="edit-input" v-model="row.phone" :class="{ 'cell-error': validErrors[row.id]?.phone }"></td>
                        </tr>
                    </tbody>
                </table>
                <div class="result" v-if="validResult">{{ validResult }}</div>
            </div>

            <div class="demo-card">
                <h3>右键菜单</h3>
                <table class="yc-data-table stripe border" @contextmenu.prevent>
                    <thead>
                        <tr>
                            <th class="cell-center" style="width: 60px;">序号</th>
                            <th>姓名</th>
                            <th>角色</th>
                            <th>部门</th>
                            <th class="cell-center" style="width: 80px;">年龄</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(row, index) in menuData" :key="row.id" @contextmenu.prevent="showContextMenu($event, row)">
                            <td class="cell-center">{{ index + 1 }}</td>
                            <td>{{ row.name }}</td>
                            <td>{{ row.role }}</td>
                            <td>{{ row.department }}</td>
                            <td class="cell-center">{{ row.age }}</td>
                        </tr>
                    </tbody>
                </table>
                <div class="result" v-if="menuResult">{{ menuResult }}</div>
            </div>
        </div>

        <div v-if="contextMenuVisible" class="context-menu" :style="{ left: contextMenuX + 'px', top: contextMenuY + 'px' }">
            <div class="context-menu-item" @click="handleMenuAction('copy')"><i class="fas fa-copy"></i> 复制</div>
            <div class="context-menu-item" @click="handleMenuAction('paste')"><i class="fas fa-paste"></i> 粘贴</div>
            <div class="context-menu-divider"></div>
            <div class="context-menu-item" @click="handleMenuAction('insert')"><i class="fas fa-plus"></i> 插入行</div>
            <div class="context-menu-item" @click="handleMenuAction('remove')"><i class="fas fa-trash"></i> 删除行</div>
            <div class="context-menu-divider"></div>
            <div class="context-menu-item" @click="handleMenuAction('detail')"><i class="fas fa-eye"></i> 查看详情</div>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted, onUnmounted } = Vue;
        createApp({
            setup() {
                const editData = ref([
                    { id: 1, name: '张三', sex: '男', age: 28, role: '前端开发', address: '北京市朝阳区' },
                    { id: 2, name: '李四', sex: '女', age: 32, role: '后端开发', address: '上海市浦东新区' },
                    { id: 3, name: '王五', sex: '男', age: 25, role: '测试工程师', address: '广州市天河区' },
                    { id: 4, name: '赵六', sex: '女', age: 30, role: '产品经理', address: '深圳市南山区' },
                    { id: 5, name: '孙七', sex: '男', age: 27, role: 'UI设计师', address: '杭州市西湖区' },
                ]);

                const validData = ref([
                    { id: 1, name: '张三', sex: '男', age: 28, email: 'zhangsan@example.com', phone: '13800138001' },
                    { id: 2, name: '李四', sex: '女', age: 32, email: 'lisi@example.com', phone: '13800138002' },
                    { id: 3, name: '', sex: '男', age: 15, email: 'invalid-email', phone: '123' },
                    { id: 4, name: '赵六', sex: '女', age: 30, email: 'zhaoliu@example.com', phone: '13800138004' },
                ]);

                const menuData = ref([
                    { id: 1, name: '张三', role: '前端开发', department: '技术部', age: 28 },
                    { id: 2, name: '李四', role: '后端开发', department: '技术部', age: 32 },
                    { id: 3, name: '王五', role: '测试工程师', department: '产品部', age: 25 },
                    { id: 4, name: '赵六', role: '产品经理', department: '产品部', age: 30 },
                ]);

                const validErrors = ref({});
                const validResult = ref('');
                const contextMenuVisible = ref(false);
                const contextMenuX = ref(0);
                const contextMenuY = ref(0);
                const menuResult = ref('');
                const contextMenuRow = ref(null);

                const insertRow = () => {
                    editData.value.unshift({ id: Date.now(), name: '', sex: '男', age: null, role: '', address: '' });
                };

                const saveData = () => {
                    alert('保存成功！（演示）');
                };

                const validateData = () => {
                    const errors = {};
                    validData.value.forEach(row => {
                        errors[row.id] = {};
                        if (!row.name) errors[row.id].name = '姓名必填';
                        if (!row.age || row.age < 18 || row.age > 60) errors[row.id].age = '年龄必须在 18-60 之间';
                        if (!row.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(row.email)) errors[row.id].email = '邮箱格式不正确';
                        if (!row.phone || !/^1[3-9]\d{9}$/.test(row.phone)) errors[row.id].phone = '手机号格式不正确';
                    });
                    validErrors.value = errors;
                    const hasErrors = Object.values(errors).some(e => Object.keys(e).length > 0);
                    validResult.value = hasErrors ? '校验不通过，请检查标红的单元格' : '校验通过！';
                };

                const showContextMenu = (e, row) => {
                    contextMenuX.value = e.clientX;
                    contextMenuY.value = e.clientY;
                    contextMenuVisible.value = true;
                    contextMenuRow.value = row;
                };

                const handleMenuAction = (action) => {
                    menuResult.value = `点击了菜单: ${action}, 行: ${contextMenuRow.value?.name || ''}`;
                    contextMenuVisible.value = false;
                };

                const hideContextMenu = () => { contextMenuVisible.value = false; };

                onMounted(() => { document.addEventListener('click', hideContextMenu); });
                onUnmounted(() => { document.removeEventListener('click', hideContextMenu); });

                return {
                    editData, validData, menuData, validErrors, validResult,
                    contextMenuVisible, contextMenuX, contextMenuY, menuResult,
                    insertRow, saveData, validateData, showContextMenu, handleMenuAction
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
