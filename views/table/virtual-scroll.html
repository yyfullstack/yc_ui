<!DOCTYPE html>
<html lang="zh-CN" yc-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>虚拟滚动 - Table Demo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../styles/index.css">
    <link rel="stylesheet" href="../../styles/components/button.css">
    <style>
        body { padding: 32px; background: var(--yc-color-bg-page); font-family: var(--yc-font-family); }
        .container { max-width: 1200px; margin: 0 auto; }
        .page-header { margin-bottom: 24px; }
        .page-header h1 { font-size: 24px; font-weight: 600; margin-bottom: 8px; }
        .page-header p { color: var(--yc-color-text-secondary); }
        .demo-card { background: #fff; border-radius: 8px; padding: 24px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
        .demo-card h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #ebeef5; }
        .actions { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

        .yc-data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            background: #fff;
        }
        .yc-data-table th, .yc-data-table td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #ebeef5;
        }
        .yc-data-table th {
            font-weight: 600;
            color: #606266;
            background: #fafafa;
        }
        .yc-data-table tbody tr:hover { background: #f5f7fa; }
        .cell-center { text-align: center; }

        .virtual-scroll-container {
            height: 400px;
            overflow-y: auto;
            border: 1px solid #ebeef5;
        }
    </style>
    <script src="https://unpkg.com/vue@3.4.0/dist/vue.global.prod.js"></script>
</head>
<body>
    <div id="app">
        <div class="container">
            <div class="page-header">
                <h1>虚拟滚动</h1>
                <p>支持大数据量虚拟滚动，可流畅渲染大量数据</p>
            </div>

            <div class="demo-card">
                <h3>纵向虚拟滚动</h3>
                <div class="actions">
                    <button class="yc-button yc-button--primary yc-button--small" @click="loadData(1000)">加载 1,000 行</button>
                    <button class="yc-button yc-button--primary yc-button--small" @click="loadData(10000)">加载 10,000 行</button>
                    <span style="font-size: 13px; color: #909399;">当前数据量: {{ tableData.length.toLocaleString() }} 行</span>
                </div>
                <div class="virtual-scroll-container" @scroll="handleScroll">
                    <div :style="{ height: totalHeight + 'px', position: 'relative' }">
                        <table class="yc-data-table" style="position: absolute; top: 0; left: 0; width: 100%;">
                            <thead style="position: sticky; top: 0; z-index: 10; background: #fafafa;">
                                <tr>
                                    <th class="cell-center" style="width: 80px;">序号</th>
                                    <th>姓名</th>
                                    <th>角色</th>
                                    <th class="cell-center" style="width: 80px;">年龄</th>
                                    <th>地址</th>
                                    <th class="cell-center" style="width: 80px;">评分</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr v-for="row in visibleData" :key="row.id" :style="{ transform: 'translateY(' + offsetY + 'px)' }">
                                    <td class="cell-center">{{ row.id }}</td>
                                    <td>{{ row.name }}</td>
                                    <td>{{ row.role }}</td>
                                    <td class="cell-center">{{ row.age }}</td>
                                    <td>{{ row.address }}</td>
                                    <td class="cell-center">{{ row.score }}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed, onMounted } = Vue;
        createApp({
            setup() {
                const tableData = ref([]);
                const rowHeight = 44;
                const containerHeight = 400;
                const scrollTop = ref(0);

                const totalHeight = computed(() => tableData.value.length * rowHeight);
                const startIndex = computed(() => Math.floor(scrollTop.value / rowHeight));
                const visibleCount = computed(() => Math.ceil(containerHeight / rowHeight) + 2);
                const visibleData = computed(() => {
                    const start = Math.max(0, startIndex.value);
                    const end = Math.min(tableData.value.length, start + visibleCount.value);
                    return tableData.value.slice(start, end);
                });
                const offsetY = computed(() => startIndex.value * rowHeight);

                function generateData(count) {
                    const names = ['张三', '李四', '王五', '赵六', '孙七', '周八', '吴九', '郑十'];
                    const roles = ['前端开发', '后端开发', '测试工程师', '产品经理', 'UI设计师', '运维工程师'];
                    const addresses = ['北京市朝阳区', '上海市浦东新区', '广州市天河区', '深圳市南山区', '杭州市西湖区'];
                    const data = [];
                    for (let i = 0; i < count; i++) {
                        data.push({
                            id: i + 1,
                            name: names[i % names.length] + (i >= names.length ? '_' + i : ''),
                            role: roles[i % roles.length],
                            age: 20 + (i % 40),
                            address: addresses[i % addresses.length],
                            score: 60 + (i % 40)
                        });
                    }
                    return data;
                }

                const loadData = (count) => {
                    tableData.value = generateData(count);
                };

                const handleScroll = (e) => {
                    scrollTop.value = e.target.scrollTop;
                };

                onMounted(() => {
                    loadData(1000);
                });

                return { tableData, totalHeight, visibleData, offsetY, loadData, handleScroll };
            }
        }).mount('#app');
    </script>
</body>
</html>
