<!DOCTYPE html>
<html lang="zh-CN" yc-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex 弹性布局组件示例 - YC UI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/demo.css">
    <style>
        .flex-demo-surface {
            padding: 16px;
            border: 1px solid var(--yc-color-border-light);
            border-radius: var(--yc-border-radius-large);
            background: linear-gradient(180deg, var(--yc-color-bg) 0%, var(--yc-color-fill-extra-light) 100%);
        }

        .flex-demo-box {
            min-height: 56px;
            padding: 12px 14px;
            border-radius: var(--yc-border-radius-base);
            background: var(--yc-layer-primary-soft);
            color: var(--yc-color-primary);
            font-weight: var(--yc-font-weight-medium);
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-page-header">
            <h1 class="demo-page-title">Flex 弹性布局</h1>
            <p class="demo-page-subtitle">统一行列方向、对齐、分布和间距语义，适合承载工具条、表单行、操作区和工作台头部布局。</p>
        </div>

        <div class="demo-section">
            <h3>基础排列</h3>
            <div class="demo-block">
                <div class="demo-block-title">水平布局</div>
                <div class="flex-demo-surface yc-flex yc-flex--gap-base yc-flex--align-center">
                    <div class="flex-demo-box">筛选条件</div>
                    <div class="flex-demo-box yc-flex__item--fill">主内容区域</div>
                    <div class="flex-demo-box">操作按钮</div>
                </div>
            </div>
        </div>

        <div class="demo-section">
            <h3>分布与换行</h3>
            <div class="demo-block">
                <div class="demo-block-title">工作台头部</div>
                <div class="flex-demo-surface yc-flex yc-flex--wrap yc-flex--justify-between yc-flex--align-center yc-flex--gap-sm">
                    <div class="flex-demo-box">标题区</div>
                    <div class="yc-flex yc-flex--wrap yc-flex--gap-sm">
                        <div class="flex-demo-box">时间范围</div>
                        <div class="flex-demo-box">成员</div>
                        <div class="flex-demo-box">导出</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="../scripts/demo-shell.js"></script>
</body>
</html>
