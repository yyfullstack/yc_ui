<!DOCTYPE html>
<html lang="zh-CN" yc-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watermark 水印组件示例 - YC UI</title>
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/demo.css">
    <style>
        .watermark-demo-card {
            min-height: 240px;
            padding: 24px;
            border: 1px solid var(--yc-color-border-light);
            border-radius: var(--yc-border-radius-large);
            background: linear-gradient(180deg, var(--yc-color-bg) 0%, var(--yc-color-fill-extra-light) 100%);
        }
    </style>
</head>
<body>
    <div class="demo-container">
        <div class="demo-page-header">
            <h1 class="demo-page-title">Watermark 水印</h1>
            <p class="demo-page-subtitle">适合预览页、导出页和共享工作台，用统一透明层语义在不打断阅读的前提下标记归属。</p>
        </div>

        <div class="demo-section">
            <h3>基础水印</h3>
            <div class="demo-block">
                <div class="demo-block-title">文档预览</div>
                <div class="yc-watermark yc-watermark--strong watermark-demo-card">
                    <div class="yc-watermark__layer">
                        <div class="yc-watermark__grid" id="watermarkGrid"></div>
                    </div>
                    <div class="yc-watermark__content">
                        <h3>渠道投放周报</h3>
                        <p>水印层放在内容层下方，并复用统一透明层语义，适合平台内预览、共享和截图场景。</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const grid = document.getElementById('watermarkGrid');
            if (!grid) return;

            const marks = Array.from({ length: 18 }, () => 'YC UI INTERNAL');
            grid.innerHTML = marks.map((text) => `<span class="yc-watermark__mark">${text}</span>`).join('');
        });
    </script>
    <script src="../scripts/demo-shell.js"></script>
</body>
</html>
